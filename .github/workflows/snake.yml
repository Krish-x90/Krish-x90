name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours for more updates
  
  workflow_dispatch:
  
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG (Modern - No Loading Bar)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-only-contributions.svg?color_snake=#2ecc71&color_dots=#2ecc71,#27ae60,#229954,#1e8449,#196f3d

      - name: Create output branch if not exists
        run: |
          if ! git ls-remote --heads origin output | grep -q output; then
            git checkout --orphan output
            git reset --hard
            git commit --allow-empty -m "Initialize output branch"
            git push origin output
          fi

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation - ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SVG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-snake-svg
          path: dist/*.svg
          retention-days: 30
